name: CSharp checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
concurrency:
  group: checks-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
permissions:
  contents: read
jobs:
  ram-program:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the GNU SuperH assembler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y binutils-sh-elf
      - name: Rebuild and verify the fixed RAM program without hardware
        run: python3 dotnet/tools/Verify-RamSelfTestProgram.py
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: dotnet/global.json
      - run: node --test ../.github/scripts/*.test.mjs
      - name: Restore MazdaLink and retained regression suite
        run: |
          dotnet restore MazdaLink.slnx --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'MazdaLink locked restore failed.' }
          dotnet restore tests/SpeedLink.Tests --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Retained regression restore failed.' }
      - name: Test the exact-target application
        run: |
          dotnet test tests/MazdaLink.Tests -c Release --no-restore --logger "trx;LogFileName=MazdaLink.trx" --results-directory TestResults/MazdaLink
          if ($LASTEXITCODE -ne 0) { throw 'Focused tests failed.' }
          ./tools/Verify-MazdaLinkIntegrity.ps1 -Results TestResults/MazdaLink/MazdaLink.trx
      - name: Retain all existing regression and ROM integrity gates
        run: |
          dotnet test tests/SpeedLink.Tests -c Release --no-restore --logger "trx;LogFileName=CSharp.trx" --results-directory TestResults
          if ($LASTEXITCODE -ne 0) { throw 'Retained regressions failed.' }
          ./tools/Verify-Regression.ps1 -Results TestResults/CSharp.trx
          ./tools/Verify-RomSaveIntegrity.ps1 -Results TestResults/CSharp.trx -Report TestResults/RomSaveIntegrity.json
      - name: Publish and exercise standalone MazdaLink
        run: ./tools/Test-MazdaLink.ps1 -Output TestResults/MazdaLinkStandalone
      - name: Package only tested MazdaLink and exact source
        run: ./tools/Package-Release.ps1 -Executable publish-mazdalink/MazdaLink.exe -Output release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ inputs.release == true }}
        with:
          name: release-package
          path: dotnet/release/*
          if-no-files-found: error
          retention-days: 7
      - name: Retain synthetic test evidence without ROM payloads
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dotnet/TestResults/**/*.trx
            dotnet/TestResults/**/*.json
            dotnet/TestResults/**/*.txt
          if-no-files-found: warn
          retention-days: 14
