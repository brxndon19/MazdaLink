name: Verify alpha21 public download
on:
  push:
    branches: [verify/alpha21-public-download]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: a1535c8d77919cec69d0b574fee2bc9f7082b576
      - name: Wait for public release and verify downloaded package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $tag='v0.9.0-alpha.21'
          $commit='a1535c8d77919cec69d0b574fee2bc9f7082b576'
          $release=$null
          for($i=0;$i -lt 60;$i++){
            try{
              $candidate=Invoke-RestMethod "https://api.github.com/repos/brxndon19/MazdaLink/releases/tags/$tag" -Headers @{Authorization="Bearer $env:GH_TOKEN"}
              if(!$candidate.draft -and $candidate.assets.Count -eq 4){$release=$candidate;break}
            }catch{}
            Start-Sleep -Seconds 30
          }
          if($null -eq $release){throw 'Public release wait expired.'}
          New-Item -ItemType Directory public-package | Out-Null
          foreach($asset in $release.assets){
            if($asset.name -notin @('MazdaLink.exe',"MazdaLink-$tag-source.zip",'release.json','SHA256SUMS.txt')){throw 'Unexpected asset.'}
            $path=Join-Path public-package $asset.name
            Invoke-WebRequest $asset.browser_download_url -OutFile $path
            $hash=(Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if($asset.digest -ne "sha256:$hash" -or (Get-Item $path).Length -ne $asset.size){throw 'Public digest/size mismatch.'}
          }
          node --input-type=module -e 'import {verifyPackage} from "./.github/scripts/release.mjs";verifyPackage("public-package","v0.9.0-alpha.21","a1535c8d77919cec69d0b574fee2bc9f7082b576");'
          if($LASTEXITCODE -ne 0){throw 'Public package verification failed.'}
          ./dotnet/tools/Verify-SourceArchive.ps1 -Archive "public-package/MazdaLink-$tag-source.zip" -Repository . -Commit $commit -Prefix 'MazdaLink/'
          $exe=[IO.Path]::GetFullPath('public-package/MazdaLink.exe')
          function Check([string[]]$ArgList,[string]$InputText,[int]$Expected,[string]$Pattern){
            $start=[Diagnostics.ProcessStartInfo]::new($exe)
            $start.UseShellExecute=$false
            $start.RedirectStandardInput=$true;$start.RedirectStandardOutput=$true;$start.RedirectStandardError=$true
            foreach($a in $ArgList){$start.ArgumentList.Add($a)}
            $p=[Diagnostics.Process]::Start($start)
            $p.StandardInput.Write($InputText);$p.StandardInput.Close()
            $stdout=$p.StandardOutput.ReadToEndAsync();$stderr=$p.StandardError.ReadToEndAsync()
            if(!$p.WaitForExit(30000)){$p.Kill();throw 'Public executable timed out.'}
            $text=$stdout.GetAwaiter().GetResult();$errors=$stderr.GetAwaiter().GetResult()
            if($p.ExitCode -ne $Expected -or $errors.Length -gt 0 -or $text -notmatch $Pattern){throw 'Public executable contract failed.'}
          }
          Check @('modified-spare-flash','missing/original.rom','missing/tune.bin') '' 1 'STOPPED'
          Check @('modified-spare-recover','missing/original.rom') '' 1 'STOPPED'
          Check @('modified-spare-flash','original.rom','tune.bin','--address','0') '' 1 'Unknown command'
          Check @('help') '' 0 'FLASH MODIFIED SPARE ZYJ2'
          Check @('help') '' 0 'RECOVER BOTH ORIGINAL ZYJ2'
          Check @('--ui-smoke',[IO.Path]::GetFullPath('public-ui')) '' 0 'UI SMOKE PASSED'
          Check @('status') '' 0 'Flashing: experimental modified ZYJ2/ZYC3 detached-spare only'
          Check @('help') '' 0 'BOUNDARY RECOVERY ZYJ2'
          Check @('--terminal') "7`n0`n" 0 'controlled unit-zero boundary / cold recovery'
          Check @('eb15-original-restore-check','missing/original.rom','missing/alpha16') '' 1 'STOPPED'
          Check @('eb15-original-restore-recover','missing/original.rom','missing/alpha16') '' 1 'STOPPED'
          Check @('eb15-original-restore-check','original.rom','run','modified.rom') '' 1 'Unknown command'
          Check @('help') '' 0 'RESTORE EB15 ORIGINAL ZYJ2'
          Check @('eb15-controlled-recovery-check','missing/original.rom','missing/alpha18') '' 1 'STOPPED'
          Check @('eb15-controlled-recovery-resume','missing/original.rom','missing/alpha18','missing/boundary') '' 1 'STOPPED'
          Check @('eb15-controlled-recovery-check','original.rom','run','--unit=1') '' 1 'Unknown command'
          Check @('help') '' 0 'BOUNDARY EB15 RECOVERY ZYJ2'
          Check @('flash','missing.rom') '' 1 'No adapter was opened'
          Check @('controlled-recovery-check','missing/original.rom','missing/alpha15') '' 1 'STOPPED'
          Check @('controlled-recovery-resume','missing/original.rom','missing/alpha15','missing/boundary') '' 1 'STOPPED'
          Check @('controlled-recovery-check','original.rom','run','unit-override') '' 1 'Unknown command'
          @'
          const fs=require('node:fs');
          const root='synthetic-backup';fs.mkdirSync(root);
          const b=Buffer.alloc(0x100000);b.write('ZYJ2EA0W',0xC0000);b.write('ZYJ2EA000ZYV5050',0xC0091);
          const ranges=[[0x7100,0xBAFFF],...Array.from({length:10},(_,i)=>[0xBB000+i*0x800,0xBB7FF+i*0x800]),[0xC0000,0xF7FFF],...Array.from({length:6},(_,i)=>[0xF8000+i*0x800,0xF87FF+i*0x800]),[0xFF800,0xFF9BF]];
          ranges.forEach(([start,end],i)=>{b.writeUInt32BE(start,0xFF650+i*12);b.writeUInt32BE(end,0xFF654+i*12);});
          b.writeUInt32BE(0xFFFFFFFF,0xFF650+19*12);b.writeUInt32BE(0x7100,0xFFFFC);
          ranges.forEach(([start,end],i)=>{let sum=0;for(let p=start;p<=end;p+=4)sum=(sum+b.readUInt32BE(p))>>>0;b.writeUInt32BE((0x5AA5A55A-sum)>>>0,0xFF658+i*12);});
          const hash=require('node:crypto').createHash('sha256').update(b).digest('hex');
          for(const n of ['original.rom','pass1.read','pass2.read'])fs.writeFileSync(root+'/'+n,b);
          fs.writeFileSync(root+'/backup.json',JSON.stringify({Schema:1,SoftwareId:'ZYJ2EA000ZYV5050',Sha256:hash,Size:b.length,Mode:'hardware'}));
          fs.writeFileSync(root+'/journal.json',JSON.stringify({SoftwareId:'ZYJ2EA000ZYV5050',Pass1Sha256:hash,Pass2Sha256:hash,Complete:true}));
          b[0xC0100]^=1;fs.writeFileSync('edited.bin',b);
          '@ | Set-Content synthetic-fixture.cjs -Encoding utf8NoBOM
          node synthetic-fixture.cjs
          if($LASTEXITCODE -ne 0){throw 'Synthetic fixture failed.'}
          Check @('prepare','synthetic-backup/original.rom','edited.bin','prepared.bin') '' 0 'PREPARED'
          Check @('validate','synthetic-backup/original.rom','prepared.bin') '' 0 'VALIDATED'
          Check @('modified-rom-plan','synthetic-backup/original.rom','prepared.bin') '' 0 '"eb15ModifiedWritingImplemented": true'
          Check @('modified-rom-plan','synthetic-backup/original.rom','prepared.bin','--write-eb15') '' 1 'Unknown command'
          @'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const original=fs.readFileSync('synthetic-backup/original.rom'),edited=fs.readFileSync('edited.bin'),prepared=fs.readFileSync('prepared.bin');
          assert.equal(edited[0xC0100],original[0xC0100]^1);assert.equal(prepared[0xC0100],edited[0xC0100]);
          for(let p=0;p<prepared.length;p++)if(prepared[p]!==original[p])assert.ok(p===0xC0100||(p>=0xFF6DC&&p<0xFF6E0));
          for(let i=0;i<19;i++){const e=0xFF650+i*12,start=prepared.readUInt32BE(e),end=prepared.readUInt32BE(e+4);let sum=prepared.readUInt32BE(e+8);for(let p=start;p<=end;p+=4)sum=(sum+prepared.readUInt32BE(p))>>>0;assert.equal(sum,0x5AA5A55A);}
          '@ | Set-Content verify-prepared.cjs -Encoding utf8NoBOM
          node verify-prepared.cjs
          if($LASTEXITCODE -ne 0){throw 'Public executable prepared checksum mismatch.'}
          Check @('modified-spare-flash','synthetic-backup/original.rom','prepared.bin') '' 1 'STOPPED'
          @{desktopUiRendered=$true;compactActionsVisible=$true;modifiedSpareCommandsVerified=$true;modifiedCombinedHardwareQualified=$false;eb15ControlledBoundaryImplemented=$true;eb15OriginalOnlyQualificationEnabled=$true;eb15ColdRecoveryQualified=$false;syntheticPreparationValidated=$true;passed=$true;tag=$tag;sourceCommit=$commit;serverHashesMatched=$true;exactSourceMatched=$true;publicExecutableExercised=$true;hardwareAccessed=$false;originalOnlyQualificationEnabled=$true;modifiedFlashingEnabled=$true;activeFlashPowerCutImplemented=$false} | ConvertTo-Json | Set-Content public-download-report.json -Encoding utf8NoBOM
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: alpha21-public-download-evidence
          path: |
            public-download-report.json
            public-ui/*.png
            public-ui/ui-report.json
          if-no-files-found: error
          retention-days: 14
